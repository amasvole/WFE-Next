<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>WFE-Next Playground</title><style>body{margin:0;background:#0d1117;color:#e6edf3;font:15px system-ui}main{max-width:1050px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:18px}textarea{box-sizing:border-box;width:100%;min-height:110px;background:#0d1117;color:#fff;border:1px solid #30363d;border-radius:9px;padding:12px}button,a.play{background:#238636;color:white;border:0;border-radius:8px;padding:10px 16px;font-weight:700;text-decoration:none;display:inline-block;margin:10px 8px 0 0}button:disabled{opacity:.4}.muted{color:#8b949e}.ok{color:#3fb950}.bad{color:#f85149}</style></head><body><main><h1>WFE-Next <span class="muted">Playground</span></h1><div class="grid"><section class="card"><h2>Project</h2><b>Software Playground</b><p class="muted">Natural-language goal → autonomous local build.</p><textarea id="goal">Describe the browser application you want WFE-Next to build.</textarea><br><button onclick="makePlan()">Generate plan</button><button id="start" disabled onclick="startRun()">START</button></section><section class="card"><h2>Plan</h2><div id="plan" class="muted">Generate a plan first.</div></section><section class="card"><h2>Run</h2><div id="run" class="muted">No run yet.</div></section><section class="card"><h2>Artifacts / PLAY</h2><div id="art" class="muted">Artifacts appear after a run.</div></section></div></main><script>let plan=null;async function makePlan(){plan=await fetch("/api/plan",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({goal:goal.value})}).then(r=>r.json());document.querySelector("#plan").innerHTML=plan.steps.map(x=>"✓ "+x.label).join("<br>")+"<p class=muted>"+plan.acceptance.join(" · ")+"</p>";start.disabled=false}async function startRun(){start.disabled=true;run.innerHTML="BUILDING…";const poll=setInterval(async()=>{try{const s=await fetch("/api/state").then(x=>x.json()),rs=Object.values(s.projects||{}).flatMap(p=>p.runs||[]).sort((a,b)=>a.startedAt.localeCompare(b.startedAt)),r=rs[rs.length-1];if(r)run.innerHTML=`<b>${r.status}</b><br>`+r.steps.map(x=>`${x.status==="DONE"?"✓":"…"} ${x.label}`).join("<br>")}catch{}},750);const r=await fetch("/api/start",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({goal:goal.value,plan})}).then(x=>x.json());clearInterval(poll);run.innerHTML=`<b class=${r.status==="DONE"?"ok":"bad"}>${r.status}</b><br>`+r.steps.map(s=>`${s.status==="DONE"?"✓":"×"} ${s.label}`).join("<br>")+"<p class=muted>Checks: "+r.checks.map(c=>c.pass?"PASS":"FAIL → "+c.failures.join(", ")).join(" → ")+"</p>";art.innerHTML=(r.product?.twist?`<b>Twist</b><br>${r.product.twist}<br><br>`:"")+r.artifacts.join("<br>")+(r.playUrl?`<br><a class=play target=_blank href="${r.playUrl}">PLAY</a>`:"");start.disabled=false}</script></body></html>
