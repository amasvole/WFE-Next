<!doctype html><html><head><meta charset="utf-8"><title>WFE-Next</title><style>body{background:#0d1117;color:#e6edf3;font:15px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:28px}.g{display:grid;grid-template-columns:240px 1fr;gap:16px}.c{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:16px;margin-bottom:14px}button,input,textarea{font:inherit}button{background:#238636;color:white;border:0;border-radius:7px;padding:9px 12px;margin:4px}input,textarea{width:100%;box-sizing:border-box;background:#0d1117;color:white;border:1px solid #30363d;border-radius:7px;padding:9px}textarea{height:105px}.p{display:block;width:100%;text-align:left;background:#21262d}.muted{color:#8b949e}.phase{font-size:22px;font-weight:700}.ok{color:#3fb950}.bad{color:#f85149}</style></head><body><main><h1>WFE-Next</h1><div class=g><aside class=c><b>Projects</b><div id=projects></div><input id=name placeholder="New project"><button id=create>Create Project</button></aside><section><div class=c><h2 id=title>Choose a Project</h2><div id=history class=muted></div></div><div class=c><textarea id=goal placeholder="What do you want to make or change?"></textarea><button id=planBtn disabled>Generate Plan</button><button id=startBtn disabled>START</button><div id=plan class=muted>No plan yet.</div></div><div class=c><div id=phase class=phase>READY</div><div id=activity class=muted></div><div id=result></div><details><summary>Technical details</summary><pre id=details></pre></details></div></section></div></main><script>
let S={},sel=null,P=null;const $=x=>document.getElementById(x),api=async(u,o)=>{const r=await fetch(u,o),x=await r.json();if(!r.ok)throw Error(x.error);return x};
async function refresh(){S=await api("/api/state");$("projects").innerHTML=Object.values(S.projects||{}).map(p=>'<button class=p data-id="'+p.id+'">'+(p.name||p.id)+' · '+p.runs.length+'</button>').join("");document.querySelectorAll(".p").forEach(b=>b.onclick=()=>pick(b.dataset.id));if(sel&&S.projects[sel])show(S.projects[sel])}
function pick(id){sel=id;P=null;$("startBtn").disabled=true;$("plan").textContent="No plan yet.";show(S.projects[id])}
function show(p){$("title").textContent=p.name||p.id;$("planBtn").disabled=(S.active||[]).includes(p.id);const r=p.runs.at(-1);const historyOpen=$("history").querySelector("details")?.open;$("history").textContent=p.runs.length+" run(s), "+p.runs.filter(x=>x.status==="DONE").length+" accepted";const history=document.createElement("details"),summary=document.createElement("summary"),list=document.createElement("ol");summary.textContent="Goal history";history.open=!!historyOpen;for(const item of p.runs){const li=document.createElement("li");li.textContent=item.status+" — "+item.goal;list.append(li)}history.append(summary,list);$("history").append(history);if(!r){$("phase").textContent="READY";$("activity").textContent="Describe a Goal.";return}$("phase").textContent=r.status;$("phase").className="phase "+(r.status==="DONE"?"ok":r.status==="BLOCKED"?"bad":"");const s=r.steps.at(-1);$("activity").textContent=(S.active||[]).includes(p.id)?(s?s.label+" · "+s.status:r.status):(r.status==="DONE"?"Verified result ready.":r.blocker||r.lastFailures?.at(-1)||"");$("details").textContent=JSON.stringify({goal:r.goal,plan:r.plan,steps:r.steps,checks:r.checks,browser:r.browserAcceptance,runtime:r.runtime,blocker:r.blocker},null,2);$("result").innerHTML=r.status==="DONE"?'<button id=open>OPEN</button>':"";if($("open"))$("open").onclick=async()=>{const x=await api("/api/open/"+p.id,{method:"POST"});window.__lastOpen=x;window.open(x.url,"_blank")}}
$("create").onclick=async()=>{const n=$("name").value.trim();if(!n)return;const id=n.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+Date.now().toString(36);await api("/api/projects",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,name:n})});await refresh();pick(id)}
$("planBtn").onclick=async()=>{$("phase").textContent="PLANNING";$("activity").textContent="Creating Goal-driven Plan…";P=await api("/api/plan",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({projectId:sel,goal:$("goal").value})});const a=P.implementation||P.deltaSteps||P.components||[];$("plan").innerHTML="<h3>Plan</h3><ul>"+a.map(x=>"<li>"+(typeof x==="string"?x:JSON.stringify(x))+"</li>").join("")+"</ul>";$("phase").textContent="READY";$("activity").textContent="Review Plan. START approves it.";$("startBtn").disabled=false}
$("startBtn").onclick=async()=>{$("startBtn").disabled=true;await api("/api/start",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({projectId:sel,goal:$("goal").value,plan:P})});refresh()}
setInterval(refresh,750);refresh();</script></body></html>
